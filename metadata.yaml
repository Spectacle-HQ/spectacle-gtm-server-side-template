homepage: "https://www.spectaclehq.com"
documentation: "https://www.spectaclehq.com/docs/installation/google-tag-manager-gtm"
versions:
  - sha: 2e81bf301642dcd3bb90d43590907abb4f8a7af0
    changeNotes: |
      Send events from webhooks and other servers

        - New setting: where does this event come from? Choose "A server or
          webhook" for events your own systems send, such as a payment from
          Stripe or a deal update from your CRM.
        - Server events are joined to the visitor with a user id or an
          anonymous id taken from the payload. Without either, the tag fails
          and says why, instead of recording a visitor who never existed.
        - Server events don't read or set cookies, and don't send the sender's
          ip or user agent as the visitor's.
        - Fixed a purchase skipped as a duplicate leaving the tag waiting until
          it timed out.
  - sha: f6510db847c0a59ae37be0174058b0f9ae8870cf
    changeNotes: |
      Fixed the template failing to import

        - A trailing comma in the permissions made the file invalid json, so
          Tag Manager rejected it outright. This is the first version that can
          be imported at all.
  - sha: 68e7fc5693d9179a641d3f22f4265b500000265d
    changeNotes: |
      Recognise a visitor the container cannot see a cookie for

        - The anonymous id can be supplied on the event as `sp_anonymous_id`,
          or set on the tag, for a host whose requests cannot carry the
          visitor's cookie -- a Shopify custom pixel, for instance
        - Fixed the ecommerce currency being read from the revenue amount,
          which left every purchase sent this way with no currency against it
  - sha: 8134ecaf8d04593474a29920fd5a8ec89d091fe2
    changeNotes: |
      Initial release of Spectacle GTM Server-Side template

      Features:
        - Page tracking with custom properties
        - User identification with traits
        - Event tracking with properties and revenue
        - Group/organization tracking
        - Spectacle Lens support
        - Transaction-id deduplication for revenue events
        - Configurable API base URL and cookie domain
