versions:
  - sha: 87720507eaf2c73eeb93a41b5c339b734a5812e9
    changeNotes: |
      Recognise a visitor the container cannot see a cookie for

        - The anonymous id can be supplied on the event as `sp_anonymous_id`,
          or set on the tag, for a host whose requests cannot carry the
          visitor's cookie -- a Shopify custom pixel, for instance
        - Fixed the ecommerce currency being read from the revenue amount,
          which left every purchase sent this way with no currency against it
  - sha: 8134ecaf8d04593474a29920fd5a8ec89d091fe2
    changeNotes: |
      Initial release of Spectacle GTM Server-Side template

      Features:
        - Page tracking with custom properties
        - User identification with traits
        - Event tracking with properties and revenue
        - Group/organization tracking
        - Spectacle Lens support
        - Transaction-id deduplication for revenue events
        - Configurable API base URL and cookie domain
